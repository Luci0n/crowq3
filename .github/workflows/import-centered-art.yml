name: Import centered artwork

on:
  push:
    branches: [hosted-images]
    paths:
      - ".github/workflows/import-centered-art.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hosted-images
          fetch-depth: 0

      - name: Download and verify image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/hosted
          curl --fail --location --max-time 1200 'https://uc3e3a41478aaabc351e2ff0eac9.dl.dropboxusercontent.com/cd/0/get/DI2eNUV4TRYlwMWmF2NJGc9toK0_MtfubEm7MzDG1v6Hrj-us238BVXd5IkWsKT-vPCiLkiF4po796n-DKgRTWPZfDvxQCP0CFCoKTLWn7B71R3ESydAHIZW1uDFYJbXppyp1rjs3FyFMNqCZZ_sM-Rxa7SzkmYryWjJ_5O-dkA18Q/file?c_luid=48a49248' -o assets/hosted/many-armed-monochrome-centered.png
          test "$(stat -c%s assets/hosted/many-armed-monochrome-centered.png)" = "3234500"
          echo "c855d44d081089bae88e1b0274a25f7be0918cffea7974b1e8fd97a9b9a51be8  assets/hosted/many-armed-monochrome-centered.png" | sha256sum -c -

      - name: Commit image and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hosted/many-armed-monochrome-centered.png
          git rm .github/workflows/import-centered-art.yml
          git commit -m "Add centered monochrome artwork"
          git push origin HEAD:hosted-images
